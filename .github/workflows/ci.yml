name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounting-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: accounting-core
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema v2 smoke suite
        run: bash docs/schema-v2-smoke.sh

  denylist:
    name: denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check denylist
        run: bash scripts/check-denylist.sh

  data-guard:
    name: data-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run data guard on tracked files
        run: python3 scripts/data_guard.py --all
      - name: Test data guard
        run: python3 -m unittest tests/test_data_guard.py

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    env:
      YA_DENYLIST: ${{ secrets.YA_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - name: Check privacy
        run: |
          if [ ! -f scripts/check-privacy.sh ]; then
            echo "::notice::scripts/check-privacy.sh is not in this branch yet (it lands with PR #80); skipping"
            exit 0
          fi
          bash scripts/check-privacy.sh
      - name: Test privacy
        run: |
          if [ ! -f scripts/test-privacy.sh ]; then
            echo "::notice::scripts/test-privacy.sh is not in this branch yet (it lands with PR #80); skipping"
            exit 0
          fi
          bash scripts/test-privacy.sh
