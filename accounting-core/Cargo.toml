[workspace]
resolver = "2"
members = [
    "crates/accounting-kernel",
    "crates/accounting-recipes",
    "crates/accounting-cli",
    "crates/accounting-privacy",
    "crates/monarch-synth",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
accounting-kernel = { path = "crates/accounting-kernel" }
accounting-recipes = { path = "crates/accounting-recipes" }

[workspace.lints.clippy]
# KernelError's largest variant is just over Clippy's 128-byte Result
# threshold. Shrinking it is a kernel change, not part of U01.
result_large_err = "allow"
# Money literals use a dollars_cents grouping (e.g. 10_000_00).
# The kernel crate itself is clean of this lint.
inconsistent_digit_grouping = "allow"
