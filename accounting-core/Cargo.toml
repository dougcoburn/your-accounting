[workspace]
resolver = "2"
members = [
    "crates/accounting-kernel",
    "crates/accounting-scenarios",
    "crates/accounting-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
accounting-kernel = { path = "crates/accounting-kernel" }
accounting-scenarios = { path = "crates/accounting-scenarios" }
